name: Build and sign iPhone shortcut

on:
  push:
    branches: [main]
    paths:
      - 'build_shortcut.py'
      - 'one-tap-dnd-2h.cherri'
      - 'validate_compiled.py'
      - 'tests/**'
      - '.github/workflows/build-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Shortcut configuration
        run: python3 -m unittest discover -s tests -v
      - name: Install official Cherri v2.3.0 compiler
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            'https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip' \
            --output /tmp/cherri.zip
          mkdir -p /tmp/cherri-tool
          unzip -q /tmp/cherri.zip -d /tmp/cherri-tool
          CHERRI="$(find /tmp/cherri-tool -type f -name cherri | head -n 1)"
          if [ -z "$CHERRI" ]; then echo 'Cherri binary not found'; exit 1; fi
          chmod +x "$CHERRI"
          echo "CHERRI=$CHERRI" >> "$GITHUB_ENV"
      - name: Build with official Cherri and request partner-supported signing
        run: |
          set -euo pipefail
          "$CHERRI" one-tap-dnd-2h.cherri --debug
          python3 validate_compiled.py
          find . -maxdepth 2 -type f -name '*.shortcut' -print
          test -s '一键免打扰（2小时）.shortcut'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('一键免打扰（2小时）.shortcut')
          assert p.read_bytes().startswith(b'AEA1'), 'Cherri did not return signed AEA1 data'
          print('Signed Cherri shortcut size:', p.stat().st_size)
          PY
      - name: Publish signed shortcut to repository
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '一键免打扰（2小时）.shortcut' dist/one-tap-dnd-2h.shortcut
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/one-tap-dnd-2h.shortcut
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Cherri signed iOS shortcut [skip ci]'
            git push
          fi
