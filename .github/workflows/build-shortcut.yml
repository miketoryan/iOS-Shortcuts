name: Build and sign iPhone shortcut

on:
  push:
    branches: [main]
    paths:
      - 'build_shortcut.py'
      - 'sign_hubsign.py'
      - 'tests/**'
      - '.github/workflows/build-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Shortcut configuration
        run: python3 -m unittest discover -s tests -v
      - name: Generate the unsigned binary plist
        run: python3 build_shortcut.py
      - name: Sign with publicly documented legacy HubSign
        run: |
          set -euo pipefail
          python3 sign_hubsign.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/signed/one-tap-dnd-2h.shortcut')
          assert p.is_file() and p.stat().st_size > 100
          assert p.read_bytes().startswith(b'AEA1'), 'No signed AEA1 envelope'
          print('Signed archive structurally valid:', p.stat().st_size, 'bytes')
          PY
      - name: Publish signed shortcut to repository
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/signed/one-tap-dnd-2h.shortcut dist/one-tap-dnd-2h.shortcut
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/one-tap-dnd-2h.shortcut
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed iOS shortcut [skip ci]'
            git push
          fi
