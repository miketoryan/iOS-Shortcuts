name: Build and sign iPhone shortcut

on:
  push:
    branches: [main]
    paths:
      - 'build_shortcut.py'
      - 'one-tap-dnd-2h.cherri'
      - 'validate_compiled.py'
      - 'sign_hubsign.py'
      - 'tests/**'
      - '.github/workflows/build-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference logic tests
        run: python3 -m unittest discover -s tests -v
      - name: Install official Cherri v2.3.0 compiler
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            'https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip' \
            --output /tmp/cherri.zip
          mkdir -p /tmp/cherri-tool
          unzip -q /tmp/cherri.zip -d /tmp/cherri-tool
          CHERRI="$(find /tmp/cherri-tool -type f -name cherri | head -n 1)"
          test -n "$CHERRI"
          chmod +x "$CHERRI"
          echo "CHERRI=$CHERRI" >> "$GITHUB_ENV"
      - name: Compile and inspect actual plist; repair static Focus dictionary
        run: |
          set -euo pipefail
          "$CHERRI" one-tap-dnd-2h.cherri --debug
          python3 validate_compiled.py
      - name: Sign the verified corrected plist
        run: |
          set -euo pipefail
          python3 sign_hubsign.py
          test -s build/signed/one-tap-dnd-2h.shortcut
      - name: Publish signed shortcut
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/signed/one-tap-dnd-2h.shortcut dist/one-tap-dnd-2h.shortcut
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/one-tap-dnd-2h.shortcut
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified DND-2h shortcut [skip ci]'
            git push
          fi
